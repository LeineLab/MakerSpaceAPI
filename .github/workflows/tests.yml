name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: makerspaceapi_ci
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Build Tailwind CSS
        run: |
          npm ci
          npm run build:css

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Smoke-test production dependencies (server boots without test-only packages)
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test-secret-key-for-ci
          OIDC_CLIENT_ID: test
          OIDC_CLIENT_SECRET: test
          OIDC_DISCOVERY_URL: https://example.com/.well-known/openid-configuration
          OIDC_REDIRECT_URI: http://localhost:8000/auth/callback
          BASE_URL: http://localhost:8000
        run: |
          alembic upgrade head
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/api/health && break
            [ "$i" -eq 20 ] && { echo "server did not become healthy"; exit 1; }
            sleep 0.5
          done
          kill %1

      # GitHub-hosted runners execute steps directly on the VM (no job container),
      # so the mariadb service is only reachable via its published host port —
      # job.services.mariadb.ports['3306'] looks that dynamically-assigned port up.
      # Gitea Actions' act-based runner always executes the job inside its own
      # container, on the same per-job Docker network as its service containers —
      # there the service is reachable by its label as a hostname on its native
      # container port (mariadb:3306) directly; the ports[] context isn't
      # populated there (it came back empty when tried), so this doesn't rely on it.
      # Two separate steps rather than one with a `cond && a || b` expression:
      # see the Docker workflow's login step for why that pattern is unreliable
      # here with act-based runners.
      - name: Migration round-trip against MariaDB (upgrade / downgrade / upgrade) [GitHub]
        if: github.server_url == 'https://github.com'
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:${{ job.services.mariadb.ports['3306'] }}/makerspaceapi_ci
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Migration round-trip against MariaDB (upgrade / downgrade / upgrade) [Gitea]
        if: github.server_url != 'https://github.com'
        env:
          DATABASE_URL: mysql+pymysql://root:root@mariadb:3306/makerspaceapi_ci
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run unit tests
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test-secret-key-for-ci
          OIDC_CLIENT_ID: test
          OIDC_CLIENT_SECRET: test
          OIDC_DISCOVERY_URL: https://example.com/.well-known/openid-configuration
          OIDC_REDIRECT_URI: http://localhost:8000/auth/callback
          BASE_URL: http://localhost:8000
        run: pytest tests/ --ignore=tests/test_ui.py -v

      - name: Run UI tests
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test-secret-key-for-ci
          OIDC_CLIENT_ID: test
          OIDC_CLIENT_SECRET: test
          OIDC_DISCOVERY_URL: https://example.com/.well-known/openid-configuration
          OIDC_REDIRECT_URI: http://localhost:8000/auth/callback
          BASE_URL: http://localhost:8000
        run: pytest tests/test_ui.py -v
