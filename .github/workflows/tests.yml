name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Build Tailwind CSS
        run: |
          npm ci
          npm run build:css

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Smoke-test production dependencies (server boots without test-only packages)
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test-secret-key-for-ci
          OIDC_CLIENT_ID: test
          OIDC_CLIENT_SECRET: test
          OIDC_DISCOVERY_URL: https://example.com/.well-known/openid-configuration
          OIDC_REDIRECT_URI: http://localhost:8000/auth/callback
          BASE_URL: http://localhost:8000
        run: |
          alembic upgrade head
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/api/health && break
            [ "$i" -eq 20 ] && { echo "server did not become healthy"; exit 1; }
            sleep 0.5
          done
          kill %1

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run unit tests
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test-secret-key-for-ci
          OIDC_CLIENT_ID: test
          OIDC_CLIENT_SECRET: test
          OIDC_DISCOVERY_URL: https://example.com/.well-known/openid-configuration
          OIDC_REDIRECT_URI: http://localhost:8000/auth/callback
          BASE_URL: http://localhost:8000
        run: pytest tests/ --ignore=tests/test_ui.py -v

      - name: Run UI tests
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test-secret-key-for-ci
          OIDC_CLIENT_ID: test
          OIDC_CLIENT_SECRET: test
          OIDC_DISCOVERY_URL: https://example.com/.well-known/openid-configuration
          OIDC_REDIRECT_URI: http://localhost:8000/auth/callback
          BASE_URL: http://localhost:8000
        run: pytest tests/test_ui.py -v
