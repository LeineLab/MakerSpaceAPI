name: Docker

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Runs identically on GitHub Actions and on Gitea Actions (both understand
      # this workflow syntax). Each pushes only to its OWN platform's registry —
      # ghcr.io needs a github.com-issued token that Gitea's own auto-generated
      # secrets.GITHUB_TOKEN can't satisfy, and vice versa. github.server_url is
      # "https://github.com" on GitHub; on Gitea it's that instance's own URL —
      # Gitea aliases the "github" context for Actions compatibility, so this
      # check works unchanged on both.
      - name: Determine target registry
        id: registry
        run: |
          if [ "${{ github.server_url }}" = "https://github.com" ]; then
            host="ghcr.io"
          else
            host="${{ github.server_url }}"
            host="${host#https://}"
            host="${host#http://}"
          fi
          image=$(echo "$host/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # On GitHub, the auto-generated secrets.GITHUB_TOKEN can push to ghcr.io.
      # Gitea's equivalent auto-token can't push to its own container registry —
      # Actions-token permissions there don't cover packages yet (still open as
      # of Gitea 1.26, see go-gitea/gitea#23642). The reliable fix there is a
      # Personal Access Token (packages: read+write) stored as the PACKAGES_USER
      # / PACKAGES_TOKEN repo (or org) Action secrets — see README for setup.
      #
      # Two separate steps, not one step with a `cond && secrets.A || secrets.B`
      # expression: act-based runners (Gitea Actions included) mask/substitute
      # secrets outside the normal expression evaluator, so a secret combined
      # into a larger &&/|| expression can silently resolve to empty instead of
      # its value — that's what happened here (both username and password came
      # back empty). Referencing each secret directly and alone, gated by a
      # plain (secret-free) `if:`, is the pattern that reliably works cross-platform.
      - name: Log in to ghcr.io
        if: github.server_url == 'https://github.com'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Gitea registry
        if: github.server_url != 'https://github.com'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ secrets.PACKAGES_USER }}
          password: ${{ secrets.PACKAGES_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registry.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,prefix=branch-,enable=${{ github.ref != 'refs/heads/main' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
