name: Docker

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # Runs identically on GitHub Actions and on Gitea Actions (both understand
      # this workflow syntax). Each pushes only to its OWN platform's registry —
      # ghcr.io needs a github.com-issued token that Gitea's own auto-generated
      # secrets.GITHUB_TOKEN can't satisfy, and vice versa. github.server_url is
      # "https://github.com" on GitHub; on Gitea it's that instance's own URL —
      # Gitea aliases the "github" context for Actions compatibility, so this
      # check works unchanged on both.
      - name: Determine target registry
        id: registry
        run: |
          if [ "${{ github.server_url }}" = "https://github.com" ]; then
            host="ghcr.io"
          else
            host="${{ github.server_url }}"
            host="${host#https://}"
            host="${host#http://}"
          fi
          image=$(echo "$host/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # On GitHub, the auto-generated secrets.GITHUB_TOKEN can push to ghcr.io.
      # Gitea's equivalent auto-token can't push to its own container registry —
      # Actions-token permissions there don't cover packages yet (still open as
      # of Gitea 1.26, see go-gitea/gitea#23642). The reliable fix there is a
      # Personal Access Token (packages: read+write) stored as the PACKAGES_USER
      # / PACKAGES_TOKEN org (or repo) Action secrets — see README for setup.
      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ github.server_url == 'https://github.com' && github.actor || secrets.PACKAGES_USER }}
          password: ${{ github.server_url == 'https://github.com' && secrets.GITHUB_TOKEN || secrets.PACKAGES_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.registry.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,prefix=branch-,enable=${{ github.ref != 'refs/heads/main' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # type=gha (GitHub's own Actions-cache service) isn't reliably usable here:
      # it times out on Gitea's cache-proxy implementation for this build's cache
      # blobs (confirmed: "dial tcp ...: i/o timeout" exporting to it). type=registry
      # instead stores the cache as an ordinary tag in whichever registry this run
      # is already pushing to (ghcr.io or Gitea's) — no separate cache service
      # involved, works identically on both platforms, no branching needed.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.registry.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.registry.outputs.image }}:buildcache,mode=max
