{% extends "base.html" %}
{% block title %}{{ _('me.title') }} – MakerSpaceAPI{% endblock %}
{% block content %}

<div x-data="mePage()" x-cloak>

  <!-- No card linked -->
  <template x-if="!loading && !profile">
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-10 text-center text-gray-500 dark:text-gray-400 text-sm">
      {{ _('me.no_card') }}
    </div>
  </template>

  <template x-if="profile">
    <div>

      <!-- Profile card -->
      <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6 mb-6 flex flex-wrap items-start justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold mb-1" x-text="profile.name || '—'"></h1>
          <p class="text-xs text-gray-400 dark:text-gray-500 font-mono">{{ _('me.card_id') }}: <span x-text="profile.id"></span></p>
          <button @click="unlinkCard()"
                  class="mt-2 text-xs text-red-500 dark:text-red-400 hover:underline">
            {{ _('me.btn_unlink_card') }}
          </button>
          <template x-if="aliases.length">
            <div class="mt-2">
              <p class="text-xs text-gray-400 dark:text-gray-500" x-text="aliasesCountText()"></p>
              <button @click="unlinkAliases()"
                      class="text-xs text-red-500 dark:text-red-400 hover:underline">
                {{ _('me.btn_unlink_aliases') }}
              </button>
            </div>
          </template>
        </div>
        <div class="text-right">
          <div class="text-3xl font-bold tabular-nums"
               :class="parseFloat(profile.balance) < 1 ? 'text-red-500 dark:text-red-400' : parseFloat(profile.balance) < 5 ? 'text-yellow-600 dark:text-yellow-400' : 'text-green-600 dark:text-green-400'"
               x-text="fmtMoney(profile.balance)"></div>
          <div class="text-xs text-gray-400 dark:text-gray-500 mt-1">{{ _('me.balance') }}</div>
        </div>
      </div>

      <!-- Two-column: rentals + machines -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">

        <!-- Currently Rented -->
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow">
          <div class="px-5 py-4 border-b dark:border-gray-700">
            <h2 class="font-semibold">{{ _('me.rentals_title') }}</h2>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <tbody>
                <template x-if="loadingRentals">
                  <tr><td class="px-4 py-6 text-center text-gray-400 dark:text-gray-500">Loading…</td></tr>
                </template>
                <template x-if="!loadingRentals && rentals.length === 0">
                  <tr><td class="px-4 py-6 text-center text-gray-400 dark:text-gray-500">{{ _('me.rentals_empty') }}</td></tr>
                </template>
                <template x-for="r in rentals" :key="r.rental_id">
                  <tr class="border-t dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700">
                    <td class="px-4 py-2 font-medium" x-text="r.item_name"></td>
                    <td class="px-4 py-2 text-xs text-gray-400 dark:text-gray-500 text-right"
                        x-text="fmtDateTime(r.rented_at)"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Authorized Machines -->
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow">
          <div class="px-5 py-4 border-b dark:border-gray-700">
            <h2 class="font-semibold">{{ _('me.machines_title') }}</h2>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <tbody>
                <template x-if="loadingMachines">
                  <tr><td class="px-4 py-6 text-center text-gray-400 dark:text-gray-500">Loading…</td></tr>
                </template>
                <template x-if="!loadingMachines && machines.length === 0">
                  <tr><td class="px-4 py-6 text-center text-gray-400 dark:text-gray-500">{{ _('me.machines_empty') }}</td></tr>
                </template>
                <template x-for="m in machines" :key="m.machine_id">
                  <tr class="border-t dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700">
                    <td class="px-4 py-2 font-medium">
                      <a :href="'/machines/' + m.machine_slug" class="hover:underline text-blue-600 dark:text-blue-400"
                         x-text="m.machine_name"></a>
                    </td>
                    <td class="px-4 py-2 text-xs text-gray-400 dark:text-gray-500 text-right"
                        x-text="parseFloat(m.price_per_minute) > 0
                          ? fmtMoney(m.price_per_minute) + '/min'
                          : _FREE_LABEL"></td>
                  </tr>
                </template>
                <template x-for="m in machines.filter(x => !x.terms_accepted)" :key="'t' + m.machine_id">
                  <tr class="bg-amber-50 dark:bg-amber-900/30">
                    <td colspan="2" class="px-4 py-2 text-xs text-amber-800 dark:text-amber-200">
                      <span class="font-medium" x-text="m.machine_name + ': ' + TERMS_PENDING_L"></span>
                      <span>{{ _('me.terms_blocked_hint') }}</span>
                      <button type="button" @click="openTerms(m)" class="ml-2 underline">{{ _('me.terms_read') }}</button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

      </div>


      <!-- Terms of use modal -->
      <div x-show="termsMachine" x-cloak class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4"
           @mousedown.self="modalMousedownOutside = true">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl w-full max-w-lg p-6" style="max-height: 90vh; overflow-y: auto;"
             @mousedown="modalMousedownOutside = false"
             @click.outside="if (modalMousedownOutside) termsMachine = null">
          <h3 class="text-lg font-semibold mb-3" x-text="termsMachine ? TERMS_TITLE_L.replace('{machine}', termsMachine.machine_name) : ''"></h3>
          <div x-show="termsError" class="mb-3 bg-red-100 dark:bg-red-900/40 text-red-700 dark:text-red-300 p-2 rounded text-sm" x-text="termsError"></div>
          <pre class="whitespace-pre-wrap text-sm mb-4" x-text="termsMachine ? termsMachine.terms_text : ''"></pre>
          <label class="flex items-start gap-2 text-sm mb-4">
            <input type="checkbox" x-model="termsChecked" class="mt-1">
            <span>{{ _('me.terms_accept') }}</span>
          </label>
          <div class="flex justify-end gap-2">
            <button type="button" @click="termsMachine = null" class="px-4 py-2 text-sm border dark:border-gray-600 rounded">{{ _('common.cancel') }}</button>
            <button type="button" @click="acceptTerms()" :disabled="!termsChecked"
                    class="px-4 py-2 text-sm bg-blue-600 text-white rounded hover:bg-blue-700 disabled:opacity-50">{{ _('me.terms_read') }}</button>
          </div>
        </div>
      </div>

      <!-- Machine Session History -->
      <div class="bg-white dark:bg-gray-800 rounded-lg shadow mb-6">
        <div class="px-5 py-4 border-b dark:border-gray-700">
          <h2 class="font-semibold">{{ _('me.sessions_title') }}</h2>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 dark:bg-gray-900 text-gray-500 dark:text-gray-400 text-xs uppercase">
              <tr>
                <th class="px-4 py-2 text-left">{{ _('me.sessions_machine') }}</th>
                <th class="px-4 py-2 text-left">{{ _('machines.col_start') }}</th>
                <th class="px-4 py-2 text-left">{{ _('machines.col_duration') }}</th>
                <th class="px-4 py-2 text-right">{{ _('machines.col_cost') }}</th>
              </tr>
            </thead>
            <tbody>
              <template x-if="loadingSessions">
                <tr><td colspan="4" class="px-4 py-6 text-center text-gray-400 dark:text-gray-500">Loading…</td></tr>
              </template>
              <template x-if="!loadingSessions && sessions.length === 0">
                <tr><td colspan="4" class="px-4 py-6 text-center text-gray-400 dark:text-gray-500">{{ _('me.sessions_empty') }}</td></tr>
              </template>
              <template x-for="s in sessions" :key="s.id">
                <tr class="border-t dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700">
                  <td class="px-4 py-2 font-medium" x-text="s.machine_name"></td>
                  <td class="px-4 py-2 text-xs text-gray-500 dark:text-gray-400 whitespace-nowrap" x-text="fmtDateTime(s.start_time)"></td>
                  <td class="px-4 py-2 text-xs text-gray-500 dark:text-gray-400">
                    <template x-if="s.end_time === null">
                      <span class="bg-green-100 dark:bg-green-900/40 text-green-700 dark:text-green-300 rounded px-1.5 py-0.5">{{ _('machines.history_active') }}</span>
                    </template>
                    <template x-if="s.end_time !== null">
                      <span x-text="fmtDuration(s.duration_seconds)"></span>
                    </template>
                  </td>
                  <td class="px-4 py-2 text-right tabular-nums text-xs"
                      x-text="fmtMoney(s.total_cost)"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
        <div class="mt-3 px-5 pb-3 text-center" x-show="sessionHasMore && !loadingSessions">
          <button @click="loadSessions()"
                  class="text-sm text-blue-600 dark:text-blue-400 hover:underline">{{ _('machines.history_load_more') }}</button>
        </div>
      </div>

      <!-- Transaction history -->
      <div class="bg-white dark:bg-gray-800 rounded-lg shadow">
        <div class="px-5 py-4 border-b dark:border-gray-700">
          <h2 class="font-semibold">{{ _('me.transactions_title') }}</h2>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 dark:bg-gray-900 text-gray-500 dark:text-gray-400 text-xs uppercase">
              <tr>
                <th class="px-4 py-2 text-left">{{ _('me.col_date') }}</th>
                <th class="px-4 py-2 text-left">{{ _('me.col_type') }}</th>
                <th class="px-4 py-2 text-left">{{ _('me.col_note') }}</th>
                <th class="px-4 py-2 text-right">{{ _('me.col_amount') }}</th>
              </tr>
            </thead>
            <tbody>
              <template x-if="loadingTx">
                <tr><td colspan="4" class="px-4 py-6 text-center text-gray-400 dark:text-gray-500">Loading…</td></tr>
              </template>
              <template x-if="!loadingTx && transactions.length === 0">
                <tr><td colspan="4" class="px-4 py-6 text-center text-gray-400 dark:text-gray-500">{{ _('me.tx_empty') }}</td></tr>
              </template>
              <template x-for="t in transactions" :key="t.id">
                <tr class="border-t dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700">
                  <td class="px-4 py-2 text-xs text-gray-500 dark:text-gray-400 whitespace-nowrap"
                      x-text="fmtDateTime(t.created_at)"></td>
                  <td class="px-4 py-2 text-xs" x-text="txLabel(t.type)"></td>
                  <td class="px-4 py-2 text-xs text-gray-500 dark:text-gray-400"
                      x-text="t.note || t.machine_name || '—'"></td>
                  <td class="px-4 py-2 text-right font-medium tabular-nums text-sm"
                      :class="parseFloat(t.amount) >= 0 ? 'text-green-600 dark:text-green-400' : 'text-red-500 dark:text-red-400'"
                      x-text="(parseFloat(t.amount) >= 0 ? '+' : '') + fmtMoney(t.amount)"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
        <div x-show="!loadingTx && hasMore" class="px-5 py-3 border-t dark:border-gray-700 text-center">
          <button @click="loadMoreTx()" :disabled="loadingMoreTx"
                  class="text-sm text-blue-600 dark:text-blue-400 hover:underline disabled:opacity-50">
            <span x-show="!loadingMoreTx">{{ _('me.load_more') }}</span>
            <span x-show="loadingMoreTx">…</span>
          </button>
        </div>
      </div>

    </div>
  </template>

</div>

<script>
const _FREE_LABEL = {{ _('me.free') | tojson }};
const _TX_LABELS = {
  'purchase':              {{ _('me.type_purchase') | tojson }},
  'topup':                 {{ _('me.type_topup') | tojson }},
  'topup_cashless':        {{ _('me.type_topup_cashless') | tojson }},
  'transfer_in':           {{ _('me.type_transfer_in') | tojson }},
  'transfer_out':          {{ _('me.type_transfer_out') | tojson }},
  'machine_login':         {{ _('me.type_machine_login') | tojson }},
  'machine_usage':         {{ _('me.type_machine_usage') | tojson }},
  'booking_target_topup':  {{ _('me.type_btt') | tojson }},
  'booking_target_payout': {{ _('me.type_btp') | tojson }},
  'admin_adjustment':      {{ _('me.type_admin') | tojson }},
};

const TERMS_PENDING_L = {{ _('me.terms_pending') | tojson }};
const TERMS_TITLE_L = {{ _('me.terms_modal_title') | tojson }};
const TERMS_CHANGED_L = {{ _('me.terms_changed') | tojson }};
function mePage() {
  return {
    termsMachine: null,
    termsChecked: false,
    termsError: '',
    modalMousedownOutside: false,
    openTerms(m) { this.termsMachine = m; this.termsChecked = false; this.termsError = ''; },
    announcePendingTerms() {
      window.dispatchEvent(new CustomEvent('terms-pending', { detail: this.machines.filter(x => !x.terms_accepted).length }));
    },
    async acceptTerms() {
      const m = this.termsMachine;
      const r = await apiFetch(`/api/v1/users/me/machines/${m.machine_slug}/terms/accept`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ version: m.terms_version }),
      });
      if (r.status === 409) { this.termsError = TERMS_CHANGED_L; await this.loadMachines(); return; }
      if (!r.ok) { this.termsError = (await r.json()).detail || 'Error'; return; }
      m.terms_accepted = true;
      this.termsMachine = null;
      this.announcePendingTerms();
    },
    profile: null,
    rentals: [],
    machines: [],
    transactions: [],
    sessions: [],
    aliases: [],
    loading: true,
    loadingRentals: true,
    loadingMachines: true,
    loadingTx: true,
    loadingMoreTx: false,
    loadingSessions: true,
    txOffset: 0,
    txLimit: 50,
    hasMore: false,
    sessionOffset: 0,
    sessionPageSize: 10,
    sessionHasMore: false,

    async init() {
      try {
        const r = await apiFetch('/api/v1/users/me');
        if (r.status === 404) { this.loading = false; return; }
        if (!r.ok) throw new Error();
        this.profile = await r.json();
      } catch {
        this.loading = false;
        return;
      }
      this.loading = false;
      await Promise.all([
        this.loadRentals(), this.loadMachines(), this.loadTx(), this.loadSessions(), this.loadAliases(),
      ]);
    },

    async loadAliases() {
      try {
        const r = await apiFetch('/api/v1/users/me/aliases');
        this.aliases = r.ok ? await r.json() : [];
      } catch {
        this.aliases = [];
      }
    },

    aliasesCountText() {
      return {{ _('me.aliases_count') | tojson }}.replace('{count}', this.aliases.length);
    },

    async loadRentals() {
      this.loadingRentals = true;
      try {
        const r = await apiFetch('/api/v1/users/me/rentals');
        this.rentals = r.ok ? await r.json() : [];
      } finally {
        this.loadingRentals = false;
      }
    },

    async loadMachines() {
      this.loadingMachines = true;
      try {
        const r = await apiFetch('/api/v1/users/me/machines');
        this.machines = r.ok ? await r.json() : [];
        this.announcePendingTerms();
      } finally {
        this.loadingMachines = false;
      }
    },

    async loadTx() {
      this.loadingTx = true;
      try {
        const r = await apiFetch(`/api/v1/users/me/transactions?limit=${this.txLimit}&offset=${this.txOffset}`);
        if (!r.ok) return;
        const data = await r.json();
        this.transactions = [...this.transactions, ...data];
        this.hasMore = data.length === this.txLimit;
        this.txOffset += data.length;
      } finally {
        this.loadingTx = false;
      }
    },

    async loadMoreTx() {
      this.loadingMoreTx = true;
      await this.loadTx();
      this.loadingMoreTx = false;
    },

    async loadSessions() {
      this.loadingSessions = true;
      try {
        const r = await apiFetch(`/api/v1/users/me/sessions?limit=${this.sessionPageSize}&offset=${this.sessionOffset}`);
        if (r.ok) {
          const data = await r.json();
          this.sessions.push(...data);
          this.sessionOffset += data.length;
          this.sessionHasMore = data.length === this.sessionPageSize;
        }
      } finally {
        this.loadingSessions = false;
      }
    },

    fmtDuration(seconds) {
      if (seconds === null || seconds === undefined) return '';
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      if (h > 0) return `${h}h ${m}m`;
      if (m > 0) return `${m}m ${s}s`;
      return `${s}s`;
    },

    txLabel(type) {
      return _TX_LABELS[type] || type;
    },

    async unlinkCard() {
      if (!confirm({{ _('me.unlink_confirm') | tojson }})) return;
      const r = await apiFetch('/api/v1/users/me/oidc', { method: 'DELETE' });
      if (r.ok) {
        this.profile = null;
      }
    },

    async unlinkAliases() {
      if (!confirm({{ _('me.unlink_aliases_confirm') | tojson }})) return;
      const r = await apiFetch('/api/v1/users/me/aliases', { method: 'DELETE' });
      if (r.ok) {
        this.aliases = [];
      }
    },
  }
}
</script>
{% endblock %}
